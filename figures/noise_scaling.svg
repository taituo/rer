<line x1="118" y1="162.6" x2="754" y2="162.6" stroke="#e7edf2" stroke-width="1"/><text x="105" y="167.6" font-size="16" fill="#566473" text-anchor="end">10⁻³</text>
<line x1="118" y1="94.5" x2="754" y2="94.5" stroke="#e7edf2" stroke-width="1"/><text x="105" y="99.5" font-size="16" fill="#566473" text-anchor="end">3×10⁻³</text>
<line x1="190" y1="77" x2="190" y2="448" stroke="#f1f4f6" stroke-width="1"/><text x="190" y="478" font-size="18" text-anchor="middle" fill="#2e3c4a">32</text>
