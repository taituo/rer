<line x1="786" x2="833" y1="317" y2="317" stroke="#357c62" stroke-width="4"/><circle cx="808" cy="317" r="6" fill="#357c62"/><text x="846" y="313" font-size="19" font-weight="700" fill="#26323e">R_and</text><text x="846" y="339" font-size="15" fill="#566473">slope −1.00</text>
<text x="120" y="566" font-size="14" fill="#576574">σ₅₀: noise level at which 50% of final answers were wrong; log-interpolated from a coarse sweep.</text>
<text x="120" y="587" font-size="14" fill="#576574">n = 300 GCD input pairs per condition; 3 range values; no confidence intervals reported. Z+round uses ideal external rounding.</text></g>
