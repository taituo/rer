<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Internal-noise tolerance decreases approximately inversely with register bound</title>
<desc id="desc">Logarithmic line chart of the Gaussian internal-noise standard deviation at 50 percent wrong final answers, sigma50, for three model variants. At register bounds 32, 128, 512, the values are Z plus external rounding 0.00214, 0.000522, 0.000137; in-network restoration R 0.000599, 0.000152, 0.0000321; and R with restoring AND gates 0.000742, 0.000180, 0.0000463.</desc>
<rect width="1100" height="620" fill="#ffffff"/>
<text x="118" y="36" font-size="25" font-weight="700" fill="#1f2937" font-family="Arial, sans-serif">Noise tolerance falls with register range</text>
<text x="118" y="60" font-size="16" fill="#576574" font-family="Arial, sans-serif">Experimental internal-noise threshold σ₅₀ vs. register bound B · logarithmic y-axis</text>
<g font-family="Arial, sans-serif"><line x1="118" y1="448.0" x2="754" y2="448.0" stroke="#e7edf2" stroke-width="1"/><text x="105" y="453.0" font-size="16" fill="#566473" text-anchor="end">10⁻⁵</text>
<line x1="118" y1="379.9" x2="754" y2="379.9" stroke="#e7edf2" stroke-width="1"/><text x="105" y="384.9" font-size="16" fill="#566473" text-anchor="end">3×10⁻⁵</text>
